# Builds the public web version (no game data: players supply their own
# ski32.exe in the page) and deploys it to GitHub Pages.
name: web

on:
  push:
    branches: [main]
  workflow_dispatch:

# Each job gets only what it needs: the build reads the repo and the Pages
# settings; only the deploy job can publish (pages: write, id-token: write).
permissions: {}

# A newer push waits for a running deploy rather than cancelling it
# midway (GitHub's Pages starter workflow does the same).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install # the version in rust-toolchain.toml, with wasm32
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: tools/build_web.sh --public
      - name: Check that no game data is in the build
        run: |
          test ! -e dist/web/PRIVATE-DO-NOT-PUBLISH.txt
          test ! -e assets/meta.json
          ls dist/web
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
