[package]
name = "skifree"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
macroquad = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
strip = true

[features]
rng_sites = []
