[package]
name = "skifree"
version = "0.1.0"
edition = "2021"
license = "MIT"
default-run = "skifree"

[dependencies]
macroquad = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
miniz_oxide = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
strip = true

[features]
rng_sites = []
# Web only: embed the extracted assets/ in the .wasm (the private build,
# tools/build_web.sh --private). Never publish such a build.
embed-assets = []

[build-dependencies]
embed-resource = "3.0.12"
